plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// Bundle the official Meteor build for this exact Minecraft version as a Fabric
// nested mod. Users install only the Null Client JAR; Fabric loads Meteor from it.
def meteorJar = layout.buildDirectory.file("generated/meteor/meteor-client.jar")
def meteorDownloadUrl = "https://meteorclient.com/api/download?version=1.21.11"

tasks.register("downloadMeteorClient") {
    outputs.file(meteorJar)
    doLast {
        def target = meteorJar.get().asFile
        target.parentFile.mkdirs()
        new URL(meteorDownloadUrl).openConnection().with {
            connectTimeout = 20000
            readTimeout = 60000
            getInputStream().withCloseable { input ->
                target.withOutputStream { output -> output << input }
            }
        }

        // Fail the build early if the official endpoint returned an error page
        // or a JAR whose Fabric metadata does not identify Meteor Client.
        // The endpoint is pinned to Minecraft 1.21.11 (archive build 86).
        new java.util.zip.ZipFile(target).withCloseable { archive ->
            def entry = archive.getEntry("fabric.mod.json")
            if (entry == null) {
                throw new GradleException("Downloaded Meteor file has no fabric.mod.json")
            }
            def metadata = archive.getInputStream(entry).getText("UTF-8")
            if (!(metadata =~ /"id"\s*:\s*"meteor-client"/).find()) {
                throw new GradleException("Downloaded mod is not Meteor Client")
            }
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    dependsOn tasks.named("downloadMeteorClient")
    from(meteorJar) {
        into "META-INF/jars"
    }
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    from("METEOR-NOTICE.md")
}
