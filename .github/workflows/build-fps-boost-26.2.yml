name: Build Null FPS Boost 26.2
on:
  push:
    branches: [fps-boost-26.2]
    paths:
      - 'fps-boost-26.2/**'
      - '.github/workflows/build-fps-boost-26.2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Build mod
        working-directory: fps-boost-26.2
        run: gradle build --no-daemon
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: null-fps-boost-26.2
          path: fps-boost-26.2/build/libs/*.jar
          if-no-files-found: error
